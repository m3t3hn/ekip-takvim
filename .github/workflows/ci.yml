name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ekip-takvim:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the demo and wait for it to be healthy
        run: |
          docker run -d --name demo -p 3000:3000 \
            -e DEMO_MODE=true -e CONFIG_PATH=/app/config/app.demo.yaml -e APP_URL=http://localhost:3000 \
            ekip-takvim:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/healthz; then exit 0; fi
            sleep 2
          done
          docker logs demo
          exit 1
