name: Bug report
description: Something doesn't work as the docs say it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Never paste secrets** (client secret, `SESSION_SECRET`, passwords): say which settings are set, not their values.
        Security problems go through a private report instead: see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: And what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Can you reproduce it in the demo (`docker compose -f compose.demo.yaml up --build`)? That helps a lot.
      placeholder: |
        1. Open the week view
        2. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: From the Status page, or the `version` field in `/healthz`.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run it?
      options:
        - Docker Compose (compose.yaml from this repo)
        - Docker, some other way
        - From source (npm)
        - Demo
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Setup
      description: Your reverse proxy and access layer (VPN, Cloudflare Access, basic auth…), and which settings you've changed. Names only, no values.
      placeholder: "Caddy, behind a VPN. Set: APP_URL, TZ, CONFIG_PATH. config/app.yaml sets timezone and teams."
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The relevant lines from `docker compose logs ekip-takvim`, and the browser console if it's a UI problem. Check them for personal data first.
      render: text
