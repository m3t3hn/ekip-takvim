name: Feature request
description: An idea that would make Ekip Takvim more useful.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation or question the app doesn't answer well today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you imagine it working. Sketches and screenshots are welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do now instead?
